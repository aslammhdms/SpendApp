include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - avoid_print
    - prefer_single_quotes
    - sort_child_properties_last
    - use_key_in_widget_constructors

analyzer:
  errors:
    invalid_annotation_target: ignore
    # Flutter 3.50 deprecates `package:flutter/material.dart` in favour of
    # the separate material_ui package, which this project has not moved to
    # yet. That one notice appears in every file, and the analyzer can only
    # switch off deprecation notices as a whole. Remove this line when the
    # imports are migrated, so other deprecations show up again.
    deprecated_member_use: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
