name: spendsheet
description: Expense tracking app with Google Sheets backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Google APIs
  google_sign_in: ^6.1.6
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  http: ^1.1.2

  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # Charts
  fl_chart: ^0.66.0

  # Notifications
  flutter_local_notifications: ^16.2.0

  # Image Handling
  image_picker: ^1.0.5

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  path: ^1.8.3

  # Routing
  go_router: ^12.1.3

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Security
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0

  # URL Launcher
  url_launcher: ^6.2.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  mocktail: ^1.0.1
  sqflite_common_ffi: ^2.3.3
  patrol: ^4.11.0
  patrol_finders: ^3.7.0

patrol:
  app_name: SpendSheet
  android:
    package_name: com.spendsheet.spendsheet

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
