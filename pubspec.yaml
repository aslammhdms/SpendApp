name: spendsheet
description: Expense tracking app with Google Sheets backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Google APIs
  google_sign_in: ^6.1.6
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  http: ^1.1.2

  # Local Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2

  # Charts
  fl_chart: ^0.66.0

  # Notifications
  flutter_local_notifications: ^23.0.2

  # Image Handling

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  connectivity_plus: ^7.3.2
  path: ^1.8.3

  # Routing
  go_router: ^12.1.3

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Security
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0

  # URL Launcher
  url_launcher: ^6.2.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.1
  sqflite_common_ffi: ^2.3.3
  patrol: ^4.11.0
  patrol_finders: ^3.7.0

patrol:
  app_name: SpendSheet
  android:
    package_name: com.spendsheet.spendsheet

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
